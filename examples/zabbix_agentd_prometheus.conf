# Укажите этот файл в Include конфигурации агента.
# Для agent2 строки UserParameter такие же. Скрипты не требуют pip-пакетов.
# Timeout агента должен превышать timeout HTTP-клиента с запасом.
# Не включайте UnsafeUserParameters=1 для этих команд.

UserParameter=k8s.prometheus.health,/usr/bin/python3 /etc/zabbix/scripts/k8s_prometheus.py --config /etc/zabbix/prometheus/k8s.json prometheus.health
UserParameter=k8s.node.discovery,/usr/bin/python3 /etc/zabbix/scripts/k8s_prometheus.py --config /etc/zabbix/prometheus/k8s.json node.discovery
UserParameter=k8s.node.condition[*],/usr/bin/python3 /etc/zabbix/scripts/k8s_prometheus.py --config /etc/zabbix/prometheus/k8s.json node.condition "$1" "$2"
UserParameter=k8s.cluster.metric[*],/usr/bin/python3 /etc/zabbix/scripts/k8s_prometheus.py --config /etc/zabbix/prometheus/k8s.json cluster "$1"
UserParameter=k8s.ingress.service_status.discovery,/usr/bin/python3 /etc/zabbix/scripts/k8s_prometheus.py --config /etc/zabbix/prometheus/k8s.json ingress.service_status.discovery
UserParameter=k8s.ingress.status.service[*],/usr/bin/python3 /etc/zabbix/scripts/k8s_prometheus.py --config /etc/zabbix/prometheus/k8s.json ingress.status.service "$1" "$2"

UserParameter=kafka.prometheus.health,/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json prometheus.health
UserParameter=kafka.exporter.up,/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json exporter.up
UserParameter=kafka.brokers,/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json brokers
UserParameter=kafka.topic.discovery,/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json topic.discovery
UserParameter=kafka.group.discovery,/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json group.discovery
UserParameter=kafka.group_topic.discovery,/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json group_topic.discovery
UserParameter=kafka.group.members[*],/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json group.members "$1"
UserParameter=kafka.topic.partitions[*],/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json topic.partitions "$1"
UserParameter=kafka.topic.under_replicated[*],/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json topic.under_replicated "$1"
UserParameter=kafka.group_topic.lag.sum[*],/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json group_topic.lag.sum "$1" "$2"
UserParameter=kafka.group_topic.lag.max[*],/usr/bin/python3 /etc/zabbix/scripts/kafka_prometheus.py --config /etc/zabbix/prometheus/kafka.json group_topic.lag.max "$1" "$2"
